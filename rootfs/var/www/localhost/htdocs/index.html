<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealthfolio wrapper</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111111; /* Donkere HA-stijl */
            color: #e1e1e1;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #1c1c1c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 { color: #03a9f4; margin-top: 0; }
        p {
            color: var(--secondary-text-color, #a0a0a0);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .open-interface-btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            background-color: #6366f1; /* Originele paarse Wealthfolio-accentkleur */
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 25px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .open-interface-btn:hover {
            background-color: #4f46e5;
        }
        .divider {
            border-top: 1px solid #333;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--ha-card-background, var(--card-background-color, #1c1c1c));
            border-radius: var(--ha-card-border-radius, 12px);
            border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, transparent);
            box-shadow: var(--ha-card-box-shadow, 0 4px 15px rgba(0,0,0,0.4));
            /* max-width: 520px; */
            /* width: 100%;*/
            padding: 2.5rem;
            text-align: center;
            display: none; /* Initially hidden until state is verified */
            box-sizing: border-box;
        }
        .notice-banner {
            background-color: rgba(255, 152, 0, 0.1);
            border-left: 4px solid var(--warning-color, #ff9800);
            padding: 12px;
            border-radius: 0 4px 4px 0;
            text-align: left;
            margin-bottom: 20px;
        }
        /* Configuration Status Table Styles */
        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            text-align: left;
        }
        .status-table th {
            color: var(--primary-text-color, #ffffff);
            border-bottom: 2px solid var(--divider-color, #333333);
            padding: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .status-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--divider-color, #222222);
            font-size: 0.95rem;
            vertical-align: top;
        }
        .status-desc {
            font-size: 0.82rem;
            color: var(--secondary-text-color, #a0a0a0);
            margin-top: 4px;
            overflow-wrap: anywhere;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-success {
            background-color: rgba(76, 175, 80, 0.15);
            color: var(--success-color, #4caf50);
            border: 1px solid var(--success-color, #4caf50);
        }
        .badge-missing {
            background-color: rgba(244, 67, 54, 0.15);
            color: var(--error-color, #f44336);
            border: 1px solid var(--error-color, #f44336);
        }
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                margin: 16px auto;
                padding: 16px;
            }
            .card {
                padding: 1rem;
            }
            .status-table {
                table-layout: fixed;
            }
            .status-table th,
            .status-table td {
                padding: 8px 6px;
            }
            .status-table th:last-child,
            .status-table td:last-child {
                width: 76px !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Global Loading Visual State -->
    <div id="loading-state" style="font-size: 1.1rem; color: var(--secondary-text-color);">
        Verifying system operational parameters...
    </div>
    <!-- VIEW A: Everything is fully configured -->
    <div id="ready-card" class="card">
        <h2>Configuration complete</h2>
        <a id="ui-button" href="#" target="_blank" rel="noopener noreferrer" class="open-interface-btn">
            Open Dashboard
        </a>
    </div>
    <!-- VIEW B: Missing configuration items -->
    <div id="setup-card" class="card">
        <h2 id="setup-title">Configuration Required</h2>

        <div class="notice-banner">
            <p>Some mandatory options have not been defined yet.</p>
        </div>
        <p id="configuration-instruction">Please open the <strong>Configuration</strong> tab of this Home Assistant app, fill in the missing values, and restart the app.</p>
        <table class="status-table">
            <thead>
                <tr>
                    <th>Option Name</th>
                    <th style="text-align: right;">Status</th>
                </tr>
            </thead>
            <tbody id="status-table-body">
                <!-- Injected dynamically via JavaScript -->
            </tbody>
        </table>
    </div>

</div>

<script>
    window.addEventListener("DOMContentLoaded", async () => {
        const loadingEl = document.getElementById("loading-state");
        const readyCard = document.getElementById("ready-card");
        const setupCard = document.getElementById("setup-card");

        try {
           // 1. Fetch the configuration status file generated by run.sh
            const response = await fetch('./config-status.json', { cache: "no-store" });
            const data = await response.json();

            loadingEl.style.display = "none";

            // 2. Always show the configuration overview
            const tableBody = document.getElementById("status-table-body");
            tableBody.innerHTML = "";

            data.options.forEach(opt => {
                const row = document.createElement("tr");

                const badgeClass = opt.configured ? "badge-success" : "badge-missing";
                const badgeText = opt.configured ? "Ready" : "Missing";

                row.innerHTML = `
                    <td>
                        <strong>${opt.name}</strong>
                        <div class="status-desc">${opt.description}</div>
                    </td>
                    <td style="text-align: right; width: 90px;">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                    </td>
                `;
                tableBody.appendChild(row);
            });
            setupCard.style.display = "block";

            // 3. Show the dashboard and suppress warnings when fully configured
            if (data.allConfigured) {
                const hostUrl = window.location.hostname;
                const targetUrl = `https://${hostUrl}:${data.port}`;

                document.getElementById("ui-button").href = targetUrl;
                readyCard.style.display = "block";
                document.getElementById("setup-title").innerText = "Configuration complete";
                document.querySelector("#setup-card .notice-banner").style.display = "none";
                document.getElementById("configuration-instruction").style.display = "none";
            } else {
                readyCard.style.display = "none";
            }
        } catch (error) {
            console.error("Critical error verification failure:", error);
            loadingEl.innerText = "Error: System could not read configuration parameters.";
            loadingEl.style.color = "var(--error-color, #ff5252)";
        }
    });

</script>
</body>
</html>
